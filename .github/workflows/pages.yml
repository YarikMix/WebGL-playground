name: Deploy to GitHub Pages

# Сайт собирается из двух веток: main — в корень, webgl — в /webgl/.
# Так обе реализации фона доступны по соседним адресам и их можно сравнить.
on:
  push:
    branches: [main, webgl]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main (Canvas 2D)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout webgl
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: webgl
          path: site/webgl

      - name: Drop repository internals
        run: rm -rf site/.git site/.github site/webgl/.git site/webgl/.github

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
