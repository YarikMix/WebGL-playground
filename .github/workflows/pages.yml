name: Deploy to GitHub Pages

# Сайт собирается из трёх веток: main — в корень, webgl — в /webgl/, r3f — в /r3f/.
# Так все реализации фона доступны по соседним адресам и их можно сравнить.
# Файл должен быть одинаковым во всех трёх ветках: push запускает workflow из той ветки,
# в которую пришёл, и устаревшая копия выложит сайт без недостающих разделов.
on:
  push:
    branches: [main, webgl, r3f]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main (Canvas 2D)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout webgl
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: webgl
          path: site/webgl

      # r3f — единственная ветка со сборкой: React + Vite, в сайт попадает только dist
      - name: Checkout r3f
        id: r3f
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: r3f
          path: r3f-src

      - uses: oven-sh/setup-bun@v2
        if: steps.r3f.outcome == 'success'

      - name: Build r3f
        if: steps.r3f.outcome == 'success'
        working-directory: r3f-src
        run: |
          bun install --frozen-lockfile
          bun run build
          mkdir -p ../site/r3f
          cp -r dist/. ../site/r3f/

      - name: Drop repository internals
        run: rm -rf site/.git site/.github site/webgl/.git site/webgl/.github

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
