<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Блокноты Nebulab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">
  <header class="top wrap">
    <div class="top-inner">
      <a class="logo" href="#" aria-label="Nebulab — на главную">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" fill="#b9a4ff"/>
          <ellipse cx="12" cy="12" rx="10.5" ry="4.2" transform="rotate(-24 12 12)" stroke="#8b6cff" stroke-width="1.4" fill="none"/>
          <circle cx="20.9" cy="7.6" r="1.5" fill="#ece9ff"/>
        </svg>
        nebulab
      </a>
      <label class="search" for="search">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="m10.6 10.6 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
        <span class="sr-only">Поиск по блокнотам</span>
        <input id="search" type="search" placeholder="Найти блокнот" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <div class="quota" title="Остаток квоты GPU в этом месяце">
        GPU <span class="meter" aria-hidden="true"><i></i></span> <b>11,5 ч</b>
      </div>
      <button class="avatar" id="avatar" type="button" aria-label="Профиль">АЛ</button>
    </div>
  </header>

  <section class="hero wrap">
    <div class="hero-row">
      <div class="hero-text">
        <span class="eyebrow"><i class="dot"></i><span id="eyebrow"></span></span>
        <h1>С возвращением на&nbsp;орбиту</h1>
        <p class="sub" id="sub"></p>
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="create" type="button">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 1.5v11M1.5 7h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
          Новый блокнот
        </button>
        <button class="btn btn-ghost" id="upload" type="button">Загрузить .ipynb</button>
      </div>
    </div>
    <div class="limb" aria-hidden="true"></div>
  </section>
  <!-- WebGL-канвас рисует весь фон: небо, планету и атмосферу. .limb выше — только источник геометрии -->
  <canvas class="stars" id="stars" aria-hidden="true"></canvas>

  <main class="wrap">
    <h2 class="sr-only">Блокноты</h2>
    <div class="bar">
      <div class="chips" id="chips" role="group" aria-label="Фильтр блокнотов"></div>
      <span class="sort">Сначала недавно изменённые</span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <svg width="56" height="56" viewBox="0 0 56 56" fill="none" aria-hidden="true">
        <circle cx="28" cy="28" r="8" fill="#2a1f5c" stroke="#8b6cff" stroke-width="1.2"/>
        <ellipse cx="28" cy="28" rx="25" ry="9" transform="rotate(-20 28 28)" stroke="#6f6990" stroke-width="1.2" stroke-dasharray="3 5" fill="none"/>
      </svg>
      <strong>На этой орбите пусто</strong>
      <span>Ничего не нашлось. Измените запрос или выберите другой фильтр.</span>
    </div>
    <div class="foot">
      <p class="note">Прототип главной. Названия блокнотов, рантаймы и квота GPU — примеры, не реальные данные.</p>
      <div class="foot-controls">
        <div class="variants" id="cards" role="group" aria-label="Стекло карточек">
          <button class="chip" type="button" id="cards-flat" data-cards="flat">Имитация</button>
          <button class="chip" type="button" id="cards-blur" data-cards="blur">Blur</button>
          <button class="chip" type="button" id="cards-liquid" data-cards="liquid">Liquid glass</button>
        </div>
        <nav class="variants" aria-label="Реализация фона">
          <a class="chip" href="../">Canvas 2D</a>
          <a class="chip" href="./" aria-current="page">WebGL</a>
        </nav>
        <button class="chip" id="motion" type="button" aria-pressed="true">Анимация фона<span>вкл</span></button>
      </div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script src="sky.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
